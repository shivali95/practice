<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JioMart Assistant</title>
<style>
/* ============ JioType Fonts ============ */
@font-face {
  font-family: 'JioType';
  src: url('https://raw.githubusercontent.com/sunit1986/JioBharatIQ_Server/main/assets/fonts/woff2/JioTypeVarW05-Regular.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'JioType';
  src: url('https://raw.githubusercontent.com/sunit1986/JioBharatIQ_Server/main/assets/fonts/woff2/JioTypeW05-Medium.woff2') format('woff2');
  font-weight: 500; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'JioType';
  src: url('https://raw.githubusercontent.com/sunit1986/JioBharatIQ_Server/main/assets/fonts/woff2/JioTypeW05-Bold.woff2') format('woff2');
  font-weight: 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'JioType';
  src: url('https://raw.githubusercontent.com/sunit1986/JioBharatIQ_Server/main/assets/fonts/woff2/JioTypeW05-Black.woff2') format('woff2');
  font-weight: 900; font-style: normal; font-display: swap;
}

/* ============ Reset & Tokens ============ */
:root {
  --primary-50: #3535f3;
  --primary-20: #e8e8fc;
  --primary-30: #9999ff;
  --primary-60: #000093;
  --secondary-50: #f7ab20;
  --secondary-20: #fef7e9;
  --sparkle-50: #1eccb0;
  --sparkle-20: #e8faf7;
  --sparkle-70: #0e5c4f;
  --error: #fa2f40;
  --warning: #f06d0f;
  --success: #25ab21;
  --grey-100: #141414;
  --grey-80: rgba(0,0,0,0.66);
  --grey-60: #b5b5b5;
  --grey-40: #e0e0e0;
  --grey-20: #f5f5f5;
  --white: #ffffff;
  --surface-default: #ffffff;
  --surface-ghost: #eeeeef;
  --surface-ghost-icon: #e7e9ff;
  --surface-bold: #3900ad;
  --surface-minimal: #f5f5f5;
  --surface-moderate: #e3e3e4;
  --text-high: #141414;
  --text-low: rgba(25,27,30,0.65);
  --text-disabled: rgba(25,27,30,0.38);
  --text-on-bold: #ffffff;
  --icon-medium: #170054;
  --stroke-subtle: rgba(36,38,43,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'JioType';
  background: #f0f0f0;
  color: var(--text-high);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-weight: 500;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 10px;
}
button { font-family: 'JioType'; cursor: pointer; border: none; background: none; }
input, textarea { font-family: 'JioType'; outline: none; border: none; }

/* ============ Phone Frame ============ */
.phone-frame {
  width: 380px;
  background: #1a1a1a;
  border-radius: 44px;
  padding: 10px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.6);
  position: relative;
}
.notch {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 28px;
  background: #000;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}
.screen {
  width: 360px;
  height: 800px;
  background: var(--white);
  border-radius: 36px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
.statusbar {
  height: 44px;
  padding: 14px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--white);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-high);
  flex-shrink: 0;
  z-index: 10;
}
.statusbar-right {
  display: flex; align-items: center; gap: 5px;
}
.signal-bars {
  display: inline-flex; gap: 1.5px; align-items: flex-end;
}
.signal-bars span {
  width: 3px; background: var(--text-high); border-radius: 1px;
}
.signal-bars span:nth-child(1) { height: 4px; }
.signal-bars span:nth-child(2) { height: 6px; }
.signal-bars span:nth-child(3) { height: 8px; }
.signal-bars span:nth-child(4) { height: 10px; }
.battery {
  width: 22px; height: 11px; border: 1px solid var(--text-high); border-radius: 3px; position: relative;
}
.battery::after {
  content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px; background: var(--text-high); border-radius: 0 1px 1px 0;
}
.battery span {
  display: block; width: 80%; height: 100%; background: var(--text-high); border-radius: 1px;
}
.wifi-icon { font-size: 12px; font-weight: 700; }

/* ============ Header ============ */
.header {
  background: var(--white);
  padding: 10px 16px 12px;
  border-bottom: 1px solid var(--stroke-subtle);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  z-index: 9;
}
.brand-dot {
  width: 28px; height: 28px;
  background: var(--primary-50);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--white);
  font-weight: 900;
  font-size: 14px;
  flex-shrink: 0;
}
.header-title-block { flex: 1; min-width: 0; }
.header-title {
  font-size: 16px; font-weight: 700; color: var(--text-high); line-height: 1.1;
}
.location-chip {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 12px; font-weight: 500; color: var(--primary-50);
  margin-top: 2px; cursor: pointer;
}
.location-chip svg { color: var(--primary-50); }
.phone-pill {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface-ghost);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: var(--grey-80);
  cursor: pointer;
  position: relative;
}
.phone-pill .live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--success);
}
.phone-dropdown {
  position: absolute; top: 36px; right: 0;
  background: var(--white);
  border: 1px solid var(--stroke-subtle);
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  width: 220px;
  z-index: 50;
  display: none;
}
.phone-dropdown.open { display: block; }
.phone-dropdown .pd-label { font-size: 11px; color: var(--text-low); margin-bottom: 4px; }
.phone-dropdown .pd-num { font-size: 14px; font-weight: 700; color: var(--text-high); margin-bottom: 12px; }
.phone-dropdown .pd-link { font-size: 13px; font-weight: 700; color: var(--primary-50); cursor: pointer; }
.phone-dropdown .pd-input-row { display: flex; gap: 6px; margin-top: 10px; }
.phone-dropdown input { flex: 1; background: var(--surface-ghost); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 500; }
.phone-dropdown .pd-go { background: var(--primary-50); color: var(--white); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }

/* ============ Chat Container ============ */
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--white);
  scroll-behavior: smooth;
}
.chat-container::-webkit-scrollbar { width: 0; }

/* ============ Messages ============ */
.msg-ai {
  max-width: 88%;
  align-self: flex-start;
  animation: msg-in 0.3s ease-out;
}
.msg-ai-bubble {
  background: var(--surface-minimal);
  border-radius: 16px 16px 16px 4px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-high);
  line-height: 1.4;
}
.msg-user {
  max-width: 80%;
  align-self: flex-end;
  background: var(--primary-50);
  color: var(--white);
  border-radius: 16px 16px 4px 16px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
  animation: msg-in-r 0.3s ease-out;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes msg-in-r {
  from { opacity: 0; transform: translateX(10px); }
  to { opacity: 1; transform: translateX(0); }
}
.feedback-row {
  display: flex; gap: 12px; padding: 6px 4px 0; align-self: flex-start; margin-top: -4px;
  animation: msg-in 0.3s ease-out;
}
.feedback-row .fbtn {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: var(--grey-60);
  cursor: pointer;
  transition: color 0.2s;
}
.feedback-row .fbtn:hover { color: var(--primary-50); }
.fbtn.like svg { transform: rotate(180deg); }

/* ============ Typing Indicator ============ */
.typing {
  background: var(--surface-minimal);
  border-radius: 16px 16px 16px 4px;
  padding: 12px 14px;
  align-self: flex-start;
  display: flex;
  gap: 4px;
  animation: msg-in 0.3s ease-out;
}
.typing span {
  width: 6px; height: 6px;
  background: var(--grey-60);
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: 0.16s; }
.typing span:nth-child(3) { animation-delay: 0.32s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}

/* ============ Chips ============ */
.chip-row {
  display: flex; flex-wrap: wrap; gap: 8px;
  align-self: flex-start; max-width: 100%;
  animation: msg-in 0.3s ease-out;
}
.chip {
  background: var(--white);
  border: 1.5px solid var(--primary-50);
  color: var(--primary-50);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.chip:hover { background: var(--primary-20); }
.chip.solid { background: var(--primary-50); color: var(--white); }
.chip.solid:hover { background: var(--primary-60); }
.chip.ghost { border-color: transparent; background: var(--surface-ghost); color: var(--text-high); }

/* ============ Card ============ */
.card {
  background: var(--white);
  border: 1px solid var(--stroke-subtle);
  border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  overflow: hidden;
  align-self: stretch;
  width: 100%;
  flex: 0 0 auto;
  flex-shrink: 0;
  animation: anim-card 0.3s ease-out both;
}
.chat-container > * { flex-shrink: 0; }
@keyframes anim-card {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ Categories Grid ============ */
.cat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  align-self: flex-start;
}
.cat-tile {
  border-radius: 16px;
  padding: 14px;
  height: 88px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer;
  transition: transform 0.15s;
  border: 1px solid var(--stroke-subtle);
}
.cat-tile:hover { transform: translateY(-2px); }
.cat-tile .cat-icon {
  width: 32px; height: 32px;
  background: var(--white);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--primary-50);
}
.cat-tile .cat-name { font-size: 13px; font-weight: 700; color: var(--text-high); }
.cat-tile.green { background: var(--sparkle-20); }
.cat-tile.green .cat-icon { color: var(--sparkle-70); }
.cat-tile.blue { background: var(--primary-20); }
.cat-tile.yellow { background: var(--secondary-20); }
.cat-tile.yellow .cat-icon { color: var(--warning); }
.cat-tile.grey { background: var(--surface-ghost); }

/* ============ Product List (carousel) ============ */
.section-title {
  font-size: 13px; font-weight: 700; color: var(--text-high);
  padding: 6px 2px 4px; align-self: flex-start;
}
.product-list {
  display: flex; gap: 10px;
  overflow-x: auto; overflow-y: visible;
  padding: 4px 2px 8px;
  width: 100%;
  align-self: stretch;
  align-items: flex-start;
  min-height: 244px;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}
.product-list::-webkit-scrollbar { display: none; }
.product-card {
  flex: 0 0 158px;
  width: 158px;
  background: var(--white);
  border: 1px solid var(--stroke-subtle);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  animation: anim-card 0.3s ease-out both;
  scroll-snap-align: start;
}
.product-card .pimg {
  width: 100%; height: 130px;
  background: var(--surface-ghost-icon);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px; font-weight: 900; color: var(--primary-50);
  position: relative;
  cursor: pointer;
}
.product-card .pimg .pletter { opacity: 0.65; position: relative; z-index: 1; }
.product-card .rank-badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--primary-50); color: var(--white);
  font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 999px;
  z-index: 2;
}
.product-card .oos-badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--error); color: var(--white);
  font-size: 9px; font-weight: 700;
  padding: 2px 6px; border-radius: 999px;
  z-index: 2;
}
.product-card .disc-badge {
  position: absolute; top: 8px; left: 8px;
  background: var(--success); color: var(--white);
  font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 6px;
  z-index: 2;
}
.product-card .pinfo { padding: 10px 12px 12px; }
.product-card .pname {
  font-size: 13px; font-weight: 700; color: var(--text-high);
  line-height: 1.25; height: 32px; overflow: hidden;
}
.product-card .prating {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 10px; font-weight: 700; color: var(--text-low);
  margin-top: 4px;
}
.product-card .prating svg { color: var(--secondary-50); }
.product-card .prow {
  display: flex; align-items: center; justify-content: space-between; margin-top: 6px;
}
.product-card .pprice { font-size: 14px; font-weight: 700; color: var(--text-high); }
.product-card .pmrp { font-size: 11px; font-weight: 500; color: var(--text-low); text-decoration: line-through; margin-left: 4px; }
.product-card .add-btn {
  width: 100%; margin-top: 8px;
  border: 1.5px solid var(--primary-50);
  background: var(--white);
  color: var(--primary-50);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12px; font-weight: 700;
  font-family: 'JioType', sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.product-card .add-btn:hover { background: var(--primary-20); }
.product-card .qty-stepper {
  width: 100%; margin-top: 8px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--primary-50); color: var(--white);
  padding: 6px 4px;
  border-radius: 999px;
  height: 32px;
}
.product-card .qty-stepper button {
  width: 28px; height: 28px;
  background: transparent; border: none; color: var(--white);
  font-size: 18px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.product-card .qty-stepper button:hover { background: rgba(255,255,255,0.15); border-radius: 999px; }
.product-card .qty-stepper .qty-num {
  font-size: 14px; font-weight: 700; flex: 1; text-align: center;
}
/* Inline size picker */
.size-pick-card {
  background: var(--primary-20);
  border-radius: 16px;
  padding: 14px;
  align-self: flex-start;
  max-width: 88%;
  width: 100%;
}
.size-pick-title {
  font-size: 14px; font-weight: 700; color: var(--primary-50);
}
.size-pick-sub {
  font-size: 12px; font-weight: 500; color: var(--text-low);
  margin-top: 2px; margin-bottom: 12px;
}
.size-pick-row {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.size-pill {
  min-width: 44px; height: 40px;
  border: 1.5px solid var(--stroke-subtle);
  background: var(--white);
  color: var(--text-high);
  font-family: 'JioType', sans-serif;
  font-size: 14px; font-weight: 700;
  border-radius: 8px;
  padding: 0 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.size-pill.sel {
  background: var(--primary-50);
  border-color: var(--primary-50);
  color: var(--white);
}
.size-confirm {
  width: 100%;
  background: var(--primary-50); color: var(--white);
  border: none; border-radius: 999px;
  padding: 10px;
  font-family: 'JioType', sans-serif;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
}
/* Order row */
.order-row {
  display: flex; gap: 12px; padding: 12px 14px;
  border-bottom: 1px solid var(--stroke-subtle);
  cursor: pointer;
  align-items: center;
}
.order-row:last-child { border-bottom: none; }
.order-thumb {
  width: 56px; height: 56px;
  background: var(--surface-ghost-icon);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 900; color: var(--primary-50);
  flex-shrink: 0;
}
.order-meta { flex: 1; min-width: 0; }
.order-name {
  font-size: 13px; font-weight: 700; color: var(--text-high);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.order-sub {
  font-size: 11px; font-weight: 500; color: var(--text-low);
  margin-top: 2px;
}
.order-status {
  display: inline-block; margin-top: 6px;
  font-size: 10px; font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
}
.order-status.placed { background: var(--sparkle-20); color: var(--sparkle-70); }
.order-status.delivered { background: var(--success); color: var(--white); }
.order-status.ofd { background: var(--primary-20); color: var(--primary-50); }
.order-status.cancelled { background: rgba(250,47,64,0.12); color: var(--error); }
/* Order detail */
.od-card { padding: 16px; }
.od-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.od-id { font-size: 14px; font-weight: 700; color: var(--text-high); }
.od-date { font-size: 11px; color: var(--text-low); }
.od-eta { font-size: 12px; color: var(--text-high); margin-top: 4px; margin-bottom: 12px; font-weight: 500; }
.od-divider { height: 1px; background: var(--stroke-subtle); margin: 12px 0; }
.od-item { display: flex; gap: 12px; align-items: center; }
.od-item-thumb { width: 44px; height: 44px; background: var(--surface-ghost-icon); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: var(--primary-50); flex-shrink: 0; }
.od-item-info { flex: 1; min-width: 0; }
.od-item-name { font-size: 13px; font-weight: 700; }
.od-item-qty { font-size: 11px; color: var(--text-low); margin-top: 2px; }
.od-item-price { font-size: 13px; font-weight: 700; }
.od-row { display: flex; justify-content: space-between; padding: 4px 0; }
.od-row .lbl { font-size: 12px; color: var(--text-low); }
.od-row .val { font-size: 12px; font-weight: 700; }
.od-row.total .lbl { font-size: 13px; color: var(--text-high); font-weight: 700; }
.od-row.total .val { font-size: 16px; font-weight: 900; color: var(--primary-50); }
.od-addr { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--text-high); margin: 8px 0 4px; line-height: 1.4; }
.od-pay { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-high); }
.od-actions { display: flex; gap: 10px; margin-top: 14px; }
.od-cancel {
  flex: 1; border: 1.5px solid var(--error); background: var(--white);
  color: var(--error); padding: 10px;
  border-radius: 999px;
  font-family: 'JioType', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
.od-reorder {
  flex: 1; border: none; background: var(--primary-50);
  color: var(--white); padding: 10px;
  border-radius: 999px;
  font-family: 'JioType', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer;
}

/* ============ Product Detail Card ============ */
.pd-card { padding: 0; }
.pd-img {
  width: 100%; height: 200px;
  background: var(--surface-ghost-icon);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px; font-weight: 900; color: var(--primary-50);
}
.pd-body { padding: 16px; }
.pd-name { font-size: 18px; font-weight: 700; color: var(--text-high); }
.pd-rrow { display: flex; align-items: center; gap: 6px; margin: 6px 0 12px; }
.pd-rrow .pd-rating { display: inline-flex; align-items: center; gap: 3px; background: var(--success); color: var(--white); padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.pd-rrow .pd-rating svg { color: var(--white); }
.pd-rrow .pd-reviews { font-size: 12px; color: var(--text-low); }
.pd-prow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.pd-prow .pd-price { font-size: 22px; font-weight: 700; color: var(--text-high); }
.pd-prow .pd-mrp { font-size: 13px; color: var(--text-low); text-decoration: line-through; }
.pd-prow .pd-disc { font-size: 12px; color: var(--success); font-weight: 700; }
.pd-desc { font-size: 13px; color: var(--text-low); line-height: 1.5; margin-top: 10px; }
.pd-actions { display: flex; gap: 8px; padding: 0 16px 16px; }
.pd-actions .btn { flex: 1; }

/* ============ Buttons ============ */
.btn {
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  padding: 0 16px;
  height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary-50); color: var(--white); }
.btn-primary:hover { background: var(--primary-60); }
.btn-secondary { background: transparent; color: var(--primary-50); border: 1.5px solid var(--primary-50); }
.btn-secondary:hover { background: var(--primary-20); }
.btn-sm { height: 36px; font-size: 13px; padding: 0 12px; }
.btn-lg { height: 52px; font-size: 15px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ============ Cart Summary ============ */
.cart-card { padding: 0; }
.cart-confirm-head {
  background: var(--sparkle-20);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 10px;
}
.cart-confirm-head .check-icon {
  width: 28px; height: 28px;
  background: var(--sparkle-50); color: var(--white);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.cart-confirm-head .cc-title { font-size: 14px; font-weight: 700; color: var(--sparkle-70); }
.cart-confirm-head .cc-sub { font-size: 12px; color: var(--sparkle-70); margin-top: 2px; }
.cart-head {
  padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--stroke-subtle);
}
.cart-head .ch-title { font-size: 16px; font-weight: 700; }
.cart-head .ch-badge { background: var(--primary-20); color: var(--primary-50); padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.cart-items { padding: 4px 0; }
.cart-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
}
.cart-item .ci-img {
  width: 44px; height: 44px;
  background: var(--surface-ghost-icon);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900; color: var(--primary-50);
  flex-shrink: 0;
}
.cart-item .ci-info { flex: 1; min-width: 0; }
.cart-item .ci-name { font-size: 13px; font-weight: 700; color: var(--text-high); }
.cart-item .ci-meta { font-size: 11px; color: var(--text-low); margin-top: 2px; }
.cart-item .ci-price { font-size: 13px; font-weight: 700; color: var(--text-high); white-space: nowrap; }
.qty-stepper {
  display: inline-flex; align-items: center; gap: 0;
  border: 1px solid var(--stroke-subtle); border-radius: 999px;
  overflow: hidden;
}
.qty-stepper button {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  color: var(--primary-50);
  background: var(--white);
}
.qty-stepper .qty-val {
  min-width: 22px; text-align: center;
  font-size: 12px; font-weight: 700; color: var(--text-high);
}
.cart-row-actions { display: flex; align-items: center; gap: 6px; }
.trash-btn { width: 26px; height: 26px; color: var(--error); display: flex; align-items: center; justify-content: center; }
.cart-foot {
  background: var(--sparkle-20);
  padding: 8px 16px;
  font-size: 12px; font-weight: 700; color: var(--sparkle-70);
  display: flex; align-items: center; gap: 6px;
}
.cart-totals { padding: 12px 16px; border-top: 1px solid var(--stroke-subtle); }
.cart-totals .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-low); margin-bottom: 6px; }
.cart-totals .row.total { font-size: 17px; font-weight: 700; color: var(--primary-50); margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--stroke-subtle); }
.cart-totals .row.success-line { color: var(--success); font-weight: 700; }
.cart-empty {
  padding: 30px 16px; text-align: center;
}
.cart-empty .emp-icon {
  width: 64px; height: 64px; margin: 0 auto 12px;
  background: var(--surface-ghost); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--grey-60);
}
.cart-empty .emp-title { font-size: 16px; font-weight: 700; }
.cart-empty .emp-sub { font-size: 13px; color: var(--text-low); margin: 4px 0 14px; }

/* ============ Bottom Sheet ============ */
.sheet-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 200;
}
.sheet-overlay.open { display: block; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--white);
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  max-height: 80%;
  overflow-y: auto;
  padding: 14px 16px 18px;
  transform: translateY(100%);
  transition: transform 0.3s ease-out;
}
.sheet-overlay.open .sheet { transform: translateY(0); }
.sheet-handle {
  width: 32px; height: 4px;
  background: var(--grey-40);
  border-radius: 999px;
  margin: 0 auto 12px;
}
.sheet-title {
  font-size: 16px; font-weight: 700; color: var(--text-high);
  margin-bottom: 12px;
}
.sheet-section-title {
  font-size: 13px; font-weight: 700; color: var(--text-low);
  margin: 12px 0 8px; text-transform: uppercase; letter-spacing: 0.5px;
}

/* Address sheet */
.addr-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px;
  border: 1px solid var(--stroke-subtle);
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.addr-row.active { border-color: var(--primary-50); background: var(--primary-20); }
.addr-radio {
  width: 18px; height: 18px;
  border: 2px solid var(--grey-60); border-radius: 50%;
  flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
}
.addr-row.active .addr-radio { border-color: var(--primary-50); }
.addr-row.active .addr-radio::after {
  content: ''; width: 8px; height: 8px; background: var(--primary-50); border-radius: 50%;
}
.addr-info { flex: 1; }
.addr-name { font-size: 14px; font-weight: 700; }
.addr-text { font-size: 12px; color: var(--text-low); margin-top: 2px; line-height: 1.4; }
.addr-add-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 1.5px dashed var(--primary-50);
  color: var(--primary-50);
  background: transparent;
  border-radius: 12px;
  padding: 12px;
  width: 100%;
  font-weight: 700;
  font-size: 13px;
  margin-top: 8px;
}

/* Address Form */
.form-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.form-tab {
  flex: 1;
  padding: 8px;
  background: var(--surface-ghost);
  border-radius: 999px;
  text-align: center;
  font-size: 12px; font-weight: 700;
  color: var(--text-low);
  cursor: pointer;
}
.form-tab.active { background: var(--primary-50); color: var(--white); }
.form-input {
  width: 100%;
  background: var(--surface-ghost);
  border-radius: 23px;
  padding: 12px 16px;
  font-size: 14px; font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-high);
}
.form-input::placeholder { color: var(--text-low); }
.form-error { font-size: 12px; color: var(--error); margin: 4px 0 8px; display: flex; align-items: center; gap: 4px; }
.form-error svg { color: var(--error); }

/* Coupon row */
.coupon-row {
  border: 1px dashed var(--stroke-subtle);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.coupon-row .cp-info { flex: 1; min-width: 0; }
.coupon-row .cp-code {
  background: var(--secondary-20);
  color: var(--warning);
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 4px;
}
.coupon-row .cp-desc { font-size: 12px; color: var(--text-low); }
.coupon-row .cp-apply { font-size: 12px; font-weight: 700; color: var(--primary-50); cursor: pointer; }

/* Bank offer row */
.bank-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px;
  border: 1px solid var(--stroke-subtle);
  border-radius: 12px;
  margin-bottom: 8px;
}
.bank-row .bank-icon {
  width: 40px; height: 40px;
  background: var(--surface-ghost-icon);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--primary-50); font-weight: 900; font-size: 13px;
  flex-shrink: 0;
}
.bank-row .bank-info { flex: 1; }
.bank-row .bank-name { font-size: 13px; font-weight: 700; }
.bank-row .bank-desc { font-size: 11px; color: var(--text-low); margin-top: 2px; }
.bank-row .bank-apply { font-size: 12px; font-weight: 700; color: var(--primary-50); cursor: pointer; }

/* Slot tabs */
.slot-tabs {
  display: flex; gap: 6px;
  background: var(--surface-ghost);
  border-radius: 999px;
  padding: 4px;
  margin-bottom: 12px;
}
.slot-tab { flex: 1; padding: 8px; text-align: center; font-size: 12px; font-weight: 700; color: var(--text-low); border-radius: 999px; cursor: pointer; }
.slot-tab.active { background: var(--white); color: var(--primary-50); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.day-block { margin-bottom: 14px; }
.day-block .day-name { font-size: 12px; font-weight: 700; color: var(--text-high); margin-bottom: 6px; }
.slot-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.slot-pill {
  padding: 6px 12px;
  background: var(--surface-ghost);
  border-radius: 999px;
  font-size: 12px; font-weight: 700;
  color: var(--text-high);
  cursor: pointer;
  border: 1.5px solid transparent;
}
.slot-pill:hover { border-color: var(--primary-50); color: var(--primary-50); }
.express-card {
  background: var(--sparkle-20);
  border-radius: 12px;
  padding: 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.express-card .ec-info .ec-title { font-size: 14px; font-weight: 700; color: var(--sparkle-70); }
.express-card .ec-info .ec-sub { font-size: 12px; color: var(--sparkle-70); margin-top: 2px; }

/* Payment options */
.pay-row {
  display: flex; align-items: center; gap: 10px;
  padding: 14px;
  border: 1px solid var(--stroke-subtle);
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.pay-row .pay-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-ghost-icon);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary-50); font-weight: 900;
  flex-shrink: 0;
}
.pay-row .pay-info { flex: 1; }
.pay-row .pay-name { font-size: 14px; font-weight: 700; }
.pay-row .pay-desc { font-size: 11px; color: var(--text-low); margin-top: 2px; }

.upi-pills { display: flex; gap: 8px; margin: 12px 0; }
.upi-pill {
  flex: 1;
  padding: 10px 8px;
  border: 1.5px solid var(--stroke-subtle);
  border-radius: 12px;
  text-align: center;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
}
.upi-pill.active { border-color: var(--primary-50); background: var(--primary-20); color: var(--primary-50); }

/* Reasons radio list */
.reason-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px;
  border: 1px solid var(--stroke-subtle);
  border-radius: 12px;
  margin-bottom: 6px;
  cursor: pointer;
}
.reason-row.active { border-color: var(--primary-50); background: var(--primary-20); }
.reason-row .rrad {
  width: 18px; height: 18px;
  border: 2px solid var(--grey-60); border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.reason-row.active .rrad { border-color: var(--primary-50); }
.reason-row.active .rrad::after { content: ''; width: 8px; height: 8px; background: var(--primary-50); border-radius: 50%; }
.reason-row span { font-size: 13px; font-weight: 500; }

/* Size sheet */
.size-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.size-pill {
  padding: 10px 16px;
  border: 1.5px solid var(--stroke-subtle);
  border-radius: 12px;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  min-width: 60px; text-align: center;
}
.size-pill.active { border-color: var(--primary-50); background: var(--primary-50); color: var(--white); }
.qty-block { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; margin-bottom: 12px; }
.qty-block .ql { font-size: 13px; font-weight: 700; }

/* JioCoins card */
.coin-card { padding: 18px; text-align: center; }
.coin-circle {
  width: 72px; height: 72px;
  background: var(--secondary-20);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
  color: var(--secondary-50);
  font-size: 30px; font-weight: 900;
  border: 2px dashed var(--secondary-50);
}
.coin-card .cc-balance { font-size: 28px; font-weight: 900; color: var(--text-high); }
.coin-card .cc-sub { font-size: 13px; color: var(--text-low); margin: 4px 0 12px; }

/* JioCoins inline icon */
.jio-coin-svg {
  width: 16px; height: 16px;
  background: var(--secondary-50); color: var(--white);
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 900;
}

/* Recipe card */
.recipe-card { padding: 16px; }
.recipe-card .rc-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
.recipe-ing-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--stroke-subtle);
}
.recipe-ing-row:last-of-type { border-bottom: none; }
.recipe-ing-row .ric-check {
  width: 20px; height: 20px;
  border: 1.5px solid var(--grey-60);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  background: var(--white);
  color: var(--white);
}
.recipe-ing-row .ric-check.checked { background: var(--primary-50); border-color: var(--primary-50); }
.recipe-ing-row .ric-name { flex: 1; font-size: 13px; font-weight: 500; }
.recipe-ing-row .ric-qty { font-size: 12px; color: var(--text-low); }

/* Deal card */
.deal-card { padding: 0; }
.deal-head {
  background: var(--secondary-50);
  color: var(--white);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.deal-head .dh-title { font-size: 15px; font-weight: 900; }
.deal-head .dh-timer {
  background: rgba(255,255,255,0.25);
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700;
}
.deal-list { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.deal-item { border: 1px solid var(--stroke-subtle); border-radius: 12px; padding: 8px; position: relative; }
.deal-item .di-img { height: 60px; background: var(--surface-ghost-icon); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary-50); font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.deal-item .di-disc { position: absolute; top: 4px; right: 4px; background: var(--error); color: var(--white); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.deal-item .di-name { font-size: 11px; font-weight: 700; line-height: 1.2; height: 26px; overflow: hidden; }
.deal-item .di-price { font-size: 12px; font-weight: 700; color: var(--text-high); margin-top: 4px; }

/* Checkout card */
.checkout-card { padding: 0; }
.co-section { padding: 14px 16px; border-bottom: 1px solid var(--stroke-subtle); }
.co-section:last-child { border-bottom: none; }
.co-label { font-size: 11px; color: var(--text-low); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.co-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; color: var(--text-high); }
.co-row.total { font-size: 18px; font-weight: 700; color: var(--primary-50); margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--stroke-subtle); }
.co-addr-row { display: flex; align-items: center; justify-content: space-between; }
.co-addr-row .ca-info { font-size: 13px; }
.co-addr-row .ca-name { font-weight: 700; }
.co-addr-row .ca-text { font-size: 11px; color: var(--text-low); margin-top: 2px; }
.co-coupon-line { background: var(--sparkle-20); padding: 8px 16px; font-size: 12px; font-weight: 700; color: var(--sparkle-70); display: flex; align-items: center; gap: 6px; }

/* Order list */
.order-list { padding: 4px 0; }
.order-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--stroke-subtle);
  cursor: pointer;
}
.order-row:last-child { border-bottom: none; }
.order-row .or-icon {
  width: 40px; height: 40px;
  background: var(--surface-ghost-icon);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--primary-50);
  flex-shrink: 0;
}
.order-row .or-info { flex: 1; min-width: 0; }
.order-row .or-id { font-size: 13px; font-weight: 700; }
.order-row .or-meta { font-size: 11px; color: var(--text-low); margin-top: 2px; }
.order-row .or-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  margin-top: 4px;
}
.or-status.delivered { background: var(--sparkle-20); color: var(--sparkle-70); }
.or-status.ofd { background: var(--secondary-20); color: var(--warning); }
.or-status.cancelled { background: #fde7e9; color: var(--error); }
.order-row .or-right { text-align: right; }
.order-row .or-total { font-size: 13px; font-weight: 700; }

/* Tracking timeline */
.track-card { padding: 16px; }
.track-step { display: flex; gap: 12px; padding: 8px 0; position: relative; }
.track-step::before {
  content: ''; position: absolute;
  left: 9px; top: 24px; bottom: -8px;
  width: 2px; background: var(--grey-40);
}
.track-step:last-child::before { display: none; }
.track-step.done::before { background: var(--primary-50); }
.track-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--white);
  border: 2px solid var(--grey-40);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 1;
}
.track-step.done .track-dot { background: var(--primary-50); border-color: var(--primary-50); color: var(--white); }
.track-step.active .track-dot {
  background: var(--primary-50); border-color: var(--primary-50);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(53,53,243,0.5); }
  50% { box-shadow: 0 0 0 8px rgba(53,53,243,0); }
}
.track-info { flex: 1; }
.track-title { font-size: 13px; font-weight: 700; }
.track-time { font-size: 11px; color: var(--text-low); margin-top: 2px; }
.track-eta {
  margin-top: 14px; padding: 12px;
  background: var(--primary-20);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.track-eta .te-l .te-label { font-size: 11px; color: var(--text-low); }
.track-eta .te-l .te-time { font-size: 18px; font-weight: 900; color: var(--primary-50); margin-top: 2px; }
.track-eta .te-r { display: flex; align-items: center; gap: 8px; }
.track-eta .te-name { font-size: 12px; font-weight: 700; }
.track-eta .te-call {
  width: 36px; height: 36px;
  background: var(--success); color: var(--white);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

/* Order detail */
.od-card { padding: 0; }
.od-section { padding: 14px 16px; border-bottom: 1px solid var(--stroke-subtle); }
.od-section:last-child { border-bottom: none; }

/* Payment success / fail */
.pay-fullscreen {
  position: absolute; inset: 0;
  background: var(--white);
  z-index: 150;
  padding: 32px 24px;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.pay-fullscreen.open { display: flex; }
.pay-success-icon {
  width: 80px; height: 80px;
  background: var(--sparkle-50); color: var(--white);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
  animation: pop 0.5s ease-out;
}
@keyframes pop {
  0% { transform: scale(0); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.pay-fail-icon {
  width: 80px; height: 80px;
  background: var(--error); color: var(--white);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
}
.pay-fullscreen h2 { font-size: 28px; font-weight: 900; color: var(--text-high); margin-bottom: 8px; }
.pay-fullscreen p { font-size: 14px; color: var(--text-low); margin-bottom: 4px; }
.pay-fullscreen .pay-eta { font-size: 14px; font-weight: 700; color: var(--primary-50); margin: 12px 0 24px; }
.pay-fullscreen .pay-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 240px; }
.pay-loader {
  width: 60px; height: 60px;
  border: 4px solid var(--surface-ghost);
  border-top-color: var(--primary-50);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Confetti */
.confetti-wrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti-piece {
  position: absolute; top: -20px;
  width: 8px; height: 14px;
  animation: confetti-fall linear forwards;
}
@keyframes confetti-fall {
  to { transform: translateY(820px) rotate(720deg); }
}

/* Toast */
.toast {
  position: absolute;
  bottom: 88px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-bold);
  color: var(--white);
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 13px; font-weight: 500;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  z-index: 300;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  white-space: nowrap;
  max-width: 320px;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Refund / complaint card */
.refund-card { padding: 14px 16px; }
.refund-row { padding: 10px 0; border-bottom: 1px solid var(--stroke-subtle); }
.refund-row:last-child { border-bottom: none; }
.rf-head { display: flex; justify-content: space-between; align-items: center; }
.rf-id { font-size: 13px; font-weight: 700; }
.rf-amount { font-size: 14px; font-weight: 700; color: var(--success); }
.rf-meta { font-size: 11px; color: var(--text-low); margin-top: 4px; }

/* Rate card */
.rate-card { padding: 16px; }
.rate-stars { display: flex; gap: 10px; justify-content: center; margin: 10px 0 14px; }
.rate-star { color: var(--grey-40); cursor: pointer; transition: transform 0.15s; }
.rate-star.active { color: var(--secondary-50); }
.rate-star:active { transform: scale(0.85); }
.rate-textarea {
  width: 100%;
  background: var(--surface-ghost);
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 13px; font-weight: 500;
  min-height: 70px;
  resize: none;
  margin-bottom: 12px;
  color: var(--text-high);
  font-family: 'JioType';
}

/* Substitute card */
.sub-card { padding: 14px 16px; }
.sub-list { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
.sub-list::-webkit-scrollbar { display: none; }

/* FBT card */
.fbt-card { padding: 12px 16px; }
.fbt-card .fbt-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }

/* Phone Login */
.login-card { padding: 18px; }
.login-card .lc-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.phone-input-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-ghost);
  border-radius: 23px;
  padding: 4px 4px 4px 14px;
}
.phone-input-row .pir-prefix { font-size: 14px; font-weight: 700; color: var(--text-high); }
.phone-input-row input {
  flex: 1; background: transparent; border: none; outline: none;
  font-size: 14px; font-weight: 500;
  padding: 12px 8px;
  color: var(--text-high);
}
.phone-input-row input::placeholder { color: var(--text-low); }
.pir-go {
  width: 38px; height: 38px;
  background: var(--primary-50); color: var(--white);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.skeleton-row {
  background: linear-gradient(90deg, var(--surface-ghost) 0%, var(--surface-moderate) 50%, var(--surface-ghost) 100%);
  /* gradient is allowed only here? rules say no gradient. Use solid */
  background: var(--surface-ghost);
  height: 12px; border-radius: 6px; margin: 6px 0;
  animation: skel 1.4s infinite;
}
@keyframes skel {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Floating cart FAB */
.cart-fab {
  position: absolute; left: 12px; right: 12px;
  bottom: 72px;
  background: var(--primary-50); color: var(--white);
  border-radius: 16px;
  padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'JioType', sans-serif;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(53,53,243,0.35);
  z-index: 10;
  animation: msg-in 0.3s ease-out;
}
.cart-fab-left { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.cart-fab-dot { opacity: 0.6; }
.cart-fab-right { font-size: 13px; font-weight: 700; }

/* Header menu button */
.hdr-menu-btn {
  width: 36px; height: 36px; border-radius: 999px;
  background: var(--surface-ghost); color: var(--text-high);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin-right: 6px;
  flex-shrink: 0;
}

/* Main menu sheet */
.menu-sheet-title {
  font-size: 18px; font-weight: 700; margin-bottom: 16px;
}
.menu-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 14px;
  border: 1px solid var(--stroke-subtle);
  border-radius: 12px;
  background: var(--white);
  font-family: 'JioType', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--text-high);
  cursor: pointer;
  text-align: left;
}
.menu-item svg { color: var(--primary-50); flex-shrink: 0; }

/* Chat input bar */
.chat-input-bar {
  background: var(--white);
  border-top: 1px solid var(--stroke-subtle);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.chat-input {
  flex: 1;
  background: var(--surface-ghost);
  border-radius: 23px;
  padding: 10px 16px;
  font-size: 14px; font-weight: 500;
  color: var(--text-high);
  border: none;
}
.chat-input::placeholder { color: var(--text-low); }
.input-icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.input-icon-btn.mic { background: var(--surface-ghost-icon); color: var(--icon-medium); }
.input-icon-btn.send { background: var(--primary-50); color: var(--white); }

/* Greeting */
.greeting-block { padding: 4px 0; align-self: flex-start; }
.greeting-block .gb-title { font-size: 22px; font-weight: 700; line-height: 1.2; }
.greeting-block .gb-sub { font-size: 13px; color: var(--text-low); margin-top: 4px; }

/* Action button row */
.action-btns-row { display: flex; gap: 8px; padding: 8px 0; flex-wrap: wrap; }

/* helpers */
.flex-row { display: flex; align-items: center; }
.gap-6 { gap: 6px; }
.gap-10 { gap: 10px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }

/* Sub-sheet for UPI inside payment */
.sub-sheet-section { display: none; }
.sub-sheet-section.open { display: block; }

/* Tracking pulse dot */
.live-pulse {
  width: 8px; height: 8px; background: var(--primary-50); border-radius: 50%;
  display: inline-block; margin-right: 4px;
  animation: pulse 1.5s infinite;
}

</style>

function handleChatInput() {

function routeUserText(text) {
  const t = text.toLowerCase();
  userMsg(text);
  // Cart/checkout
  if (/\b(my\s+cart|view\s+cart|show\s+cart|open\s+cart|cart)\b/.test(t)) return typingThen(() => { _showCartBody(); });
  if (/\b(checkout|pay|payment|place\s+order|proceed)\b/.test(t)) return typingThen(() => { _showCheckoutBody(); });
  if (/\b(coupon|promo|discount\s+code)\b/.test(t)) return typingThen(() => { aiMsg('Pick a coupon to apply:'); showCouponSheet(); });
  if (/\b(jiocoin|jio\s*coin|points|rewards)\b/.test(t)) return typingThen(() => { _showJioCoinsBody(); });
  // Orders
  if (/\b(order\s+history|my\s+orders|past\s+orders|recent\s+orders|orders)\b/.test(t)) return typingThen(() => { _showOrdersBody(); });
  if (/\b(track|where.*order|order.*status)\b/.test(t)) return typingThen(() => { const o = state.orders.find(x => x.status==='Out for Delivery') || state.orders[0]; showTracking(o.id); });
  if (/\b(cancel\s+order|cancel)\b/.test(t)) return typingThen(() => { aiMsg('Which order would you like to cancel?'); _showOrdersBody(); });
  if (/\b(reorder|order\s+again)\b/.test(t)) return typingThen(() => { reorder(state.orders[0].id); });
  if (/\b(return|refund\s+request)\b/.test(t)) return typingThen(() => { showReturnSheet(state.orders[0].id); });
  if (/\b(refund\s+status|refund)\b/.test(t)) return typingThen(() => { _showRefundBody(); });
  if (/\b(complaint\s+status)\b/.test(t)) return typingThen(() => { _showComplaintStatusBody(); });
  if (/\b(raise\s+complaint|complaint|issue|wrong\s+item|damaged)\b/.test(t)) return typingThen(() => { aiMsg('Tell us what went wrong:'); showComplaintSheet(); });
  if (/\b(rate|review|rating)\b/.test(t)) return typingThen(() => { _showRateBody(); });
  // Discovery
  if (/\b(deals?|offers?|sale|flash)\b/.test(t)) return typingThen(() => { _showDealsBody(); });
  if (/\b(recipe|biryani|paneer|dal)\b/.test(t)) return typingThen(() => { _showRecipesBody(); });
  if (/\b(best\s*sellers?|popular|top)\b/.test(t)) return typingThen(() => { _showBestSellersBody(); });
  // Address
  if (/\b(address|delivery\s+location|change\s+location|pincode)\b/.test(t)) return typingThen(() => { aiMsg('Pick a delivery address:'); openAddressSheet(); });
  // Multi-item search
  const multi = parseMultiItems(t);
  if (multi.length >= 2) return typingThen(() => { multiItemFromText(multi); });
  // Single product search
  const matched = matchProducts(t);
  if (matched.length > 0) return typingThen(() => { aiMsg(`Here's what I found for "${text}":`); appendProductList(matched.length>=2 ? matched.slice(0,4) : pickRelated(matched[0])); });
  // Fallback
  typingThen(() => {
    aiMsg("I can help with shopping, your cart, orders, deals, recipes, addresses and more. Try: “Show me milk and bread”, “My cart”, “Order history”, “Deals of the day”.");
  });
}

function matchProducts(t) {
  const words = t.split(/[^a-z]+/).filter(Boolean);
  const ids = new Set();
  // Direct keyword map
  const keymap = {
    milk:['milk','dairy','amul'], atta:['atta','wheat','flour','aashirvaad'], bread:['bread','britannia'],
    oil:['oil','sunflower','fortune'], salt:['salt','tata','namak'], butter:['butter','makhan'],
    tea:['tea','chai','assam','darjeeling'], shoes:['shoes','shoe','sneakers','footwear','nike','running']
  };
  for (const id in keymap) {
    if (keymap[id].some(k => t.includes(k))) ids.add(id);
  }
  // Fallback: try product name partials
  if (ids.size === 0) {
    for (const id in PRODUCTS) {
      const n = PRODUCTS[id].name.toLowerCase();
      if (words.some(w => w.length >= 3 && n.includes(w))) ids.add(id);
    }
  }
  return Array.from(ids);
}
function parseMultiItems(t) {
  const matched = matchProducts(t);
  return matched;
}
function pickRelated(id) {
  const out = [id];
  const cat = PRODUCTS[id].cat;
  for (const k in PRODUCTS) {
    if (k !== id && PRODUCTS[k].cat === cat) out.push(k);
    if (out.length >= 4) break;
  }
  while (out.length < 4) {
    for (const k in PRODUCTS) if (!out.includes(k)) { out.push(k); break; }
  }
  return out.slice(0,4);
}
function multiItemFromText(ids) {
  aiMsg('I found all your items. Tap ADD on any to add to cart:');
  ids.forEach(id => {
    const sec = document.createElement('div');
    sec.className = 'multi-section';
    sec.innerHTML = `<div class="multi-section-title">${PRODUCTS[id].name.split(' ').slice(0,2).join(' ')}</div>`;
    appendNode(sec);
    appendProductList(pickRelated(id).slice(0,3));
  });
  appendChips([
    { label:'View cart', solid:true, fn: showCart },
    { label:'Continue shopping', fn: showHome }
  ]);
}

function quickAdd(id, slotEl) {
  const p = PRODUCTS[id];
  if (p && p.sizes) { state.pendingProduct = id; openSizeInChat(id); return; }
  let entry = state.cart.find(c => c.id === id);
  if (entry) entry.qty += 1;
  else state.cart.push({ id, qty: 1 });
  renderStepperInSlot(slotEl, id);
  toast('Added to cart');
  refreshCartFab();
  if (!state._addPromptShown) {
    state._addPromptShown = true;
    aiMsg('Want to view your cart or keep adding more?', false);
    appendChips([
      { label:'View cart', fn: showCart, solid: true },
      { label:'Checkout', fn: showCheckout },
      { label:'Continue shopping', fn: () => showHome() }
    ]);
  }
}
function renderStepperInSlot(slotEl, id) {
  const entry = state.cart.find(c => c.id === id);
  const qty = entry ? entry.qty : 0;
  if (qty <= 0) {
    slotEl.innerHTML = `<button class="add-btn" onclick="quickAdd('${id}', this.parentElement)">+ ADD</button>`;
    return;
  }
  slotEl.innerHTML = `
    <div class="qty-stepper">
      <button onclick="quickQty('${id}', -1, this.closest('.add-slot'))">&minus;</button>
      <span class="qty-num">${qty}</span>
      <button onclick="quickQty('${id}', 1, this.closest('.add-slot'))">+</button>
    </div>
  `;
}
function quickQty(id, delta, slotEl) {
  let entry = state.cart.find(c => c.id === id);
  if (!entry) {
    if (delta > 0) { state.cart.push({ id, qty: 1 }); renderStepperInSlot(slotEl, id); refreshCartFab(); }
    return;
  }
  entry.qty += delta;
  if (entry.qty <= 0) state.cart = state.cart.filter(c => c.id !== id);
  renderStepperInSlot(slotEl, id);
  refreshCartFab();
}
function quickPrompt(text, fn) {
  userMsg(text);
  typingThen(fn);
}

function cartTotals() {
  let sub = 0;
  state.cart.forEach(i => { sub += PRODUCTS[i.id].price * i.qty; });
  let discount = 0;
  if (state.appliedCoupon === 'NEW20') discount = Math.min(50, Math.round(sub * 0.2));
  if (state.appliedCoupon === 'FRESH50' && sub >= 500) discount = 50;
  if (state.appliedCoupon === 'MILK10') discount = 10;
  let coinDisc = state.appliedJioCoins ? 34 : 0;
  const taxes = Math.round(sub * 0.05);
  const delivery = sub >= 199 ? 0 : 25;
  const total = sub + delivery + taxes - discount - coinDisc;
  return { sub, discount, coinDisc, taxes, delivery, total };
}

function updateQty(id, d) {
  const item = state.cart.find(x => x.id === id);
  if (!item) return;
  item.qty += d;
  if (item.qty <= 0) {
    state.cart = state.cart.filter(x => x.id !== id);
  }
  toast('Quantity updated');
  refreshCart();
  refreshCartFab();
}
function removeItem(id) {
  state.cart = state.cart.filter(x => x.id !== id);
  toast('Item removed from cart');
  refreshCart();
  refreshCartFab();
  if (state.cart.length === 0) state._addPromptShown = false;
}
function refreshCart() {
  const old = document.getElementById('cartCard');
  if (old) old.remove();
  if (state.cart.length === 0) {
    const c = document.createElement('div');
    c.className = 'card';
    c.id = 'cartCard';
    c.innerHTML = `

        <div class="emp-sub">Start shopping</div>

      </div>
    `;
    appendNode(c);
  } else {
    renderCartCard();
  }
}

    p.className = 'confetti-piece';

        </div>

          <div class="track-dot"></div>
          <div class="track-info"><div class="track-title" style="color:var(--primary-50);"><span class="live-pulse"></span>Out for Delivery</div><div class="track-time">Now</div></div>
        </div>
        <div class="track-step">
          <div class="track-dot"></div>
          <div class="track-info"><div class="track-title" style="color:var(--text-low);">Delivered</div><div class="track-time">Pending</div></div>
        </div>
        <div class="track-eta">
          <div class="te-l">
            <div class="te-label">ETA</div>
            <div class="te-time">12 min</div>
          </div>

              <div class="te-name">Rajesh K.</div>

    appendNode(c);
    appendChips([
      { label:'Need Help?', fn: () => showHelpChips(id) },
      { label:'Home', fn: showHome }
    ]);
  });
}

function reorder(id) {
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  state.cart = o.items.map(i => ({ id: i.p || i.id, qty: i.q || i.qty })).filter(x => PRODUCTS[x.id]);
  userMsg('Reorder');
  typingThen(() => {
    aiMsg(`All ${state.cart.length} items added to your cart!`);
    renderCartCard();
    appendChips([
      { label:'Checkout', solid:true, fn: showCheckout },
      { label:'View Cart', fn: showCart }
    ]);
  });
}

function showHelpChips(id) {
  appendChips([
    { label:'Cancel Order', fn: () => showCancelSheet(id) },
    { label:'Return Item', fn: () => showReturnSheet(id) },
    { label:'Raise Complaint', fn: () => showComplaintSheet(id) },
    { label:'Rate this order', fn: () => showRateCard(id) }
  ]);
}

/* ========== Cancel (UC 36) ========== */
function showCancelSheet(id) {
  openSheet(`
    <div class="sheet-title">Why are you cancelling?</div>
    <div class="reason-row" onclick="pickCancelReason(this,'Wrong item')"><div class="rrad"></div><span>Wrong item ordered</span></div>
    <div class="reason-row" onclick="pickCancelReason(this,'Don\\'t need anymore')"><div class="rrad"></div><span>Don't need anymore</span></div>
    <div class="reason-row" onclick="pickCancelReason(this,'Found cheaper elsewhere')"><div class="rrad"></div><span>Found cheaper elsewhere</span></div>
    <div class="reason-row" onclick="pickCancelReason(this,'Delivery taking long')"><div class="rrad"></div><span>Delivery taking long</span></div>
    <div class="reason-row" onclick="pickCancelReason(this,'Other')"><div class="rrad"></div><span>Other</span></div>
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:12px;" onclick="confirmCancel('${id}')">Confirm Cancel</button>
  `);
}
function pickCancelReason(el, reason) {
  el.parentNode.querySelectorAll('.reason-row').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  state.selectedReturnReason = reason;
}
function confirmCancel(id) {
  const o = state.orders.find(x => x.id === id);
  if (o) o.status = 'Cancelled';
  state.hasRefund = true;
  closeSheet();
  userMsg('Cancel order');
  typingThen(() => {
    aiMsg(`Order <b>${id}</b> cancelled. Refund of ₹${o?o.total:342} will reflect in 3-5 business days.`);
    appendChips([
      { label:'Refund status', fn: showRefundStatus },
      { label:'Home', fn: showHome }
    ]);
  });
}

/* ========== Return (UC 38) ========== */
function showReturnSheet(id) {
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  openSheet(`
    <div class="sheet-title">Select item to return</div>
    ${o.items.map((i,idx) => {
      const p = PRODUCTS[i.p || i.id];
      if (!p) return '';
      return `<div class="reason-row" onclick="pickReturnItem(this,'${p.id}')"><div class="rrad"></div><span>${p.name} × ${i.q||i.qty}</span></div>`;
    }).join('')}
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:12px;" onclick="showReturnReason('${id}')">Next</button>
  `);
}
function pickReturnItem(el, id) {
  el.parentNode.querySelectorAll('.reason-row').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
}
function showReturnReason(id) {
  openSheet(`
    <div class="sheet-title">Reason for return</div>
    <div class="reason-row" onclick="pickCancelReason(this,'Damaged')"><div class="rrad"></div><span>Damaged on delivery</span></div>
    <div class="reason-row" onclick="pickCancelReason(this,'Wrong')"><div class="rrad"></div><span>Wrong item delivered</span></div>
    <div class="reason-row" onclick="pickCancelReason(this,'Quality')"><div class="rrad"></div><span>Quality issue</span></div>
    <div class="reason-row" onclick="pickCancelReason(this,'Expiry')"><div class="rrad"></div><span>Expiry concern</span></div>
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:12px;" onclick="confirmReturn('${id}')">Confirm Return</button>
  `);
}
function confirmReturn(id) {
  state.hasRefund = true;
  closeSheet();
  userMsg('Return item');
  typingThen(() => {
    aiMsg('Return scheduled. Pickup on <b>2 May 2026, 10 AM-12 PM</b>. Refund ₹45 after pickup.');
    appendChips([
      { label:'Refund status', fn: showRefundStatus },
      { label:'Home', fn: showHome }
    ]);
  });
}

/* ========== Rate (UC 40) ========== */
function showRateCard(id) {
  userMsg('Rate this order');
  typingThen(() => {
    aiMsg('Rate this order:');
    const c = document.createElement('div');
    c.className = 'card';
    c.id = 'rateCard';
    c.innerHTML = `
      <div class="rate-card">
        <div style="font-size:14px;font-weight:700;text-align:center;">How was your experience?</div>
        <div class="rate-stars">
          ${[1,2,3,4,5].map(n => `<div class="rate-star" onclick="setRating(${n})" data-n="${n}">${ICN.star(28)}</div>`).join('')}
        </div>
        <div id="rateExpand" style="display:none;">
          <textarea class="rate-textarea" placeholder="Tell us more (optional)"></textarea>
          <button class="btn btn-primary btn-block" onclick="submitRating()">Submit Review</button>
        </div>
      </div>
    `;
    appendNode(c);
  });
}
function setRating(n) {
  state.rating = n;
  document.querySelectorAll('#rateCard .rate-star').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.n) <= n);
  });
  document.getElementById('rateExpand').style.display = 'block';
}
function submitRating() {
  toast('Thanks for your feedback!');
  document.getElementById('rateCard').remove();
  aiMsg(`Thanks for the ${state.rating}-star rating!`);
}

/* ========== Complaint (UC 41) ========== */
function showComplaintSheet(id) {
  openSheet(`
